name: RTK and context audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static RTK integration audit
        run: python3 scripts/rtk_integration_audit.py
      - name: Context efficiency smoke test
        run: node scripts/context_efficiency_smoke.mjs
      - name: Native RTK wrapper smoke test
        run: node scripts/rtk_native_smoke.mjs
