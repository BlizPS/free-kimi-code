name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skills
        run: python3 scripts/check_skills.py
      - name: Validate repository metadata
        run: python3 scripts/validate.py
      - name: Run safety scan
        run: python3 scripts/safety_scan.py
      - name: Verify JavaScript syntax
        run: |
          node --check scripts/lazydev.mjs
          node --check runtime/openai-history.mjs
