name: RTK or context regression
description: Report unexpected token/context growth or RTK filtering regressions
title: "[RTK/Context] "
labels:
  - bug
body:
  - type: textarea
    id: command
    attributes:
      label: Command or workflow
      description: Include the command that caused the unusually large output.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context metrics
      description: Include native context, active tokens, saved tokens, and any archive hits.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
