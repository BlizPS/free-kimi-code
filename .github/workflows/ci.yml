name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify package
        run: |
          node --check scripts/lazydev.mjs
          node --check runtime/intelligence-kernel.mjs
          node --check hooks/lazydev-prompt-context.mjs
          node --check hooks/lazydev-path-guard.mjs
          node --check hooks/lazydev-shell-guard.mjs
          npm test
      - name: Static package checks
        run: |
          python3 scripts/check_skills.py
          python3 scripts/token_budget.py
          python3 scripts/eval_skills.py
          python3 scripts/compat_smoke.py
          python3 scripts/style_scan.py
          python3 scripts/safety_scan.py
          python3 scripts/validate.py
          python3 -m py_compile scripts/*.py
          python3 scripts/sync_skills.py --check
