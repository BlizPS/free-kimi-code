name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static safety scan
        run: python3 scripts/safety_scan.py
      - name: Validate package
        run: python3 scripts/validate.py
      - name: Check mirrors are in sync
        run: python3 scripts/sync_skills.py --check
      - name: Check token budget
        run: python3 scripts/token_budget.py
      - name: Evaluate skill quality signals
        run: python3 scripts/eval_skills.py
