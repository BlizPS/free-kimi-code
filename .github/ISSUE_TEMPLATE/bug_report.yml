name: Bug report
description: Report a reproducible problem in Free Kimi Code
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, terminal, native CLI, and LazyDev version.
      placeholder: macOS / Linux / Windows / Termux · Kimi Code/Codex/Antigravity · 1.0.3
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest set of steps or commands that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs or test output. Remove secrets first.
    validations:
      required: false
