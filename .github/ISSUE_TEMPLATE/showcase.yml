name: Showcase
description: Share a project or workflow you built with Lazy Developer
title: "[Showcase] "
body:
  - type: input
    id: project
    attributes:
      label: Project
      description: What did you build?
      placeholder: My dashboard / CLI / app
    validations:
      required: true
  - type: textarea
    id: used
    attributes:
      label: What did Lazy Developer help with?
      description: Mention the skill, UI/UX, 3D, debugging, review, testing, or workflow.
      placeholder: I used lazy-developer for...
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: Public project or demo link, if available.
      placeholder: https://github.com/...
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: One useful detail, screenshot description, or lesson for other users.
    validations:
      required: false
