<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Free Kimi Code</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3b82f6" stop-opacity="1"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="360" rx="24"/></clipPath>
    <clipPath id="textClip">
      <text x="360" y="218" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="108" font-weight="700" letter-spacing="-2">Free Kimi Code</text>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="#0b0f19"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <ellipse cx="200" cy="180" rx="280" ry="230" fill="url(#halo)"/>

    <!-- jalur data di background -->
    <g fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
      <path d="M1240 56 H1120 L1090 86 H900" stroke-dasharray="6 10">
        <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M380 304 H700 L730 274 H1040 L1064 298 H1240" stroke-dasharray="6 10">
        <animate attributeName="stroke-dashoffset" from="0" to="64" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#3b82f6" opacity="0.6">
      <circle cx="1240" cy="56" r="4"/>
      <circle cx="900" cy="86" r="4"/>
      <circle cx="1240" cy="298" r="4"/>
      <circle cx="380" cy="304" r="4"/>
    </g>

    <!-- scanline pelan -->
    <rect x="0" y="-10" width="1280" height="2" fill="#3b82f6" opacity="0.14">
      <animate attributeName="y" values="-10;370" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- logo -->
    <g transform="translate(90 70)">
      <!-- riak dari tiap node -->
      <g fill="none" stroke="#3b82f6" stroke-width="2">
        <circle cx="110" cy="6" r="10" opacity="0"><animate attributeName="r" values="10;34" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/></circle>
        <circle cx="200" cy="58" r="10" opacity="0"><animate attributeName="r" values="10;34" dur="3s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
        <circle cx="200" cy="162" r="10" opacity="0"><animate attributeName="r" values="10;34" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
        <circle cx="110" cy="214" r="10" opacity="0"><animate attributeName="r" values="10;34" dur="3s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
        <circle cx="20" cy="162" r="10" opacity="0"><animate attributeName="r" values="10;34" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
        <circle cx="20" cy="58" r="10" opacity="0"><animate attributeName="r" values="10;34" dur="3s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="3s" begin="2.5s" repeatCount="indefinite"/></circle>
      </g>

      <path d="M110 6 L200 58 V162 L110 214 L20 162 V58 Z" fill="#0b0f19" stroke="#3b82f6" stroke-width="10" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.6s" fill="freeze"/>
      </path>
      <path d="M110 34 L176 72 V148 L110 186 L44 148 V72 Z" fill="none" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="2" stroke-linejoin="round"/>
      <g fill="#3b82f6">
        <circle cx="110" cy="6" r="10"/>
        <circle cx="200" cy="58" r="10"/>
        <circle cx="200" cy="162" r="10"/>
        <circle cx="110" cy="214" r="10"/>
        <circle cx="20" cy="162" r="10"/>
        <circle cx="20" cy="58" r="10"/>
      </g>
      <path d="M76 78 L116 110 L76 142" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M130 146 H164" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- judul + sapuan biru -->
    <text x="360" y="218" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="108" font-weight="700" letter-spacing="-2" fill="#f8fafc">Free Kimi Code</text>
    <g clip-path="url(#textClip)">
      <rect x="-200" y="110" width="200" height="130" fill="url(#sweep)" opacity="0.85">
        <animate attributeName="x" values="300;1240" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- siku pojok -->
    <g fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <path d="M24 56 V24 H56"/>
      <path d="M1224 24 H1256 V56"/>
      <path d="M24 304 V336 H56"/>
      <path d="M1224 336 H1256 V304"/>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="358" rx="23" fill="none" stroke="#1e293b" stroke-width="2"/>
</svg>
